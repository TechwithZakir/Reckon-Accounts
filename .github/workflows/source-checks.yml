name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install build 'flit_core>=3.4,<4' ruff
      - run: python -m unittest discover -s reckon_accounts/tests -v
      - run: node --test reckon_accounts/tests/test_report_controls.cjs
      - run: ruff check reckon_accounts
      - run: python -m build --no-isolation
      - run: git diff --check
