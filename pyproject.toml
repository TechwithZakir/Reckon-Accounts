[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "reckon_accounts"
authors = [{name = "Reckon Technologies Ltd."}]
description = "Tally-oriented accounting reports and navigation for ERPNext"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dynamic = ["version"]
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.flit.sdist]
include = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
